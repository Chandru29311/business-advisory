<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | STACKLY Business Advisory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .big-404 {
      font-size: 160px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -4px;
      text-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }
    .floating-shape {
      position: absolute;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 1;
    }

    /* Responsive Media Queries for 404 Page */
    @media (max-width: 992px) {
      .big-404 {
        font-size: 120px;
      }
    }

    @media (max-width: 768px) {
      .big-404 {
        font-size: 85px !important;
        letter-spacing: -2px !important;
      }
      .floating-shape {
        display: none !important;
      }
      .error-title {
        font-size: 24px !important;
        line-height: 1.3 !important;
      }
      .error-desc {
        font-size: 15px !important;
      }
    }

    @media (max-width: 480px) {
      .big-404 {
        font-size: 70px !important;
      }
      .error-title {
        font-size: 20px !important;
      }
      .error-actions .btn {
        width: 100% !important;
        justify-content: center !important;
      }
    }

    @media (max-width: 380px) {
      .big-404 {
        font-size: 56px !important;
      }
      .error-title {
        font-size: 18px !important;
      }
    }
  </style>
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="error-page-wrapper">
    <div class="blob blob-green" style="top: 20%; left: 10%; width: 350px; height: 350px;"></div>
    <div class="blob blob-mint" style="bottom: 20%; right: 10%; width: 400px; height: 400px;"></div>

    <!-- Floating Business Elements -->
    <div class="floating-shape float-anim" style="top: 15%; left: 15%;"><i class="fa-solid fa-bullseye"></i> Strategy Missed</div>
    <div class="floating-shape float-anim" style="top: 25%; right: 18%; animation-delay: -2s;"><i class="fa-solid fa-chart-pie"></i> Route Uncharted</div>
    <div class="floating-shape float-anim" style="bottom: 20%; left: 20%; animation-delay: -4s;"><i class="fa-solid fa-shield-halved"></i> Risk Managed</div>

    <div class="container" style="max-width: 700px; z-index: 2; position: relative;">
      <a href="index.html" style="display: inline-block; margin-bottom: 30px;">
        <img src="assets/logo.webp" alt="STACKLY Logo" style="height: 48px; margin: 0 auto; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.6));">
      </a>

      <div class="big-404">404</div>

      <h1 class="error-title" style="font-size: 32px; font-weight: 800; margin-bottom: 16px; color: #ffffff;">
        Looks Like This Business Route Took A Wrong Turn.
      </h1>

      <p class="error-desc" style="color: var(--text-muted); font-size: 17px; margin-bottom: 36px; max-width: 580px; margin-left: auto; margin-right: auto;">
        The page you're looking for could not be found. Let's get your business journey back on track.
      </p>

      <div class="error-actions" style="display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;">
        <button onclick="goBackToPreviousSection()" class="btn btn-secondary" style="padding: 14px 28px; border-radius: 999px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;">
          <i class="fa-solid fa-arrow-left"></i>
          Back To Previous Page
        </button>
        <a href="index.html" class="btn btn-primary" style="padding: 14px 28px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px;">
          <i class="fa-solid fa-house"></i>
          Back To Home
        </a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    function goBackToPreviousSection() {
      const returnUrl = sessionStorage.getItem('stackly_return_url');

      // 1. Primary method: history.back() returns browser to exact previous section state & scroll position
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
        return;
      }

      // 2. Fallback to recorded return URL or document.referrer
      if (returnUrl) {
        window.location.href = returnUrl;
        return;
      }

      if (document.referrer) {
        window.location.href = document.referrer;
        return;
      }

      // 3. Fallback to homepage
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        gsap.from('.big-404', {
          duration: 1,
          scale: 0.7,
          opacity: 0,
          ease: 'back.out(1.7)'
        });

        gsap.from('.error-actions', {
          duration: 0.8,
          y: 20,
          opacity: 0,
          delay: 0.2,
          ease: 'power2.out'
        });

        window.addEventListener('mousemove', (e) => {
          const { clientX, clientY } = e;
          const x = (clientX / window.innerWidth - 0.5) * 20;
          const y = (clientY / window.innerHeight - 0.5) * 20;
          gsap.to('.floating-shape', {
            x: x,
            y: y,
            duration: 1,
            ease: 'power1.out'
          });
        });
      }
    });
  </script>
</body>
</html>
