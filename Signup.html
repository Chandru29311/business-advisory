<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - STACKLY Business Advisory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i>Back To Home</a>

    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo-link" style="display: inline-block;">
          <img src="assets/logo.webp" alt="STACKLY Logo">
        </a>
        <h2>Create Account</h2>
        <p>Join the STACKLY Business Advisory Network</p>
      </div>

      <!-- Role Selector -->
      <div class="role-selector">
        <button type="button" class="role-btn active" data-role="Client">Client Account</button>
        <button type="button" class="role-btn" data-role="Admin">Admin Account</button>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="fullName" placeholder="Jane Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Business Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="jane@company.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div id="auth-error" class="error-message"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">Register Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="Login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
