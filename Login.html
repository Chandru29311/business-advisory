<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - STACKLY Business Advisory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i>Back To Home</a>

    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo-link" style="display: inline-block;">
          <img src="assets/logo.webp" alt="STACKLY Logo">
        </a>
        <h2>Welcome Back</h2>
        <p>Access your STACKLY Business Advisory Portal</p>
      </div>

      <!-- Role Selector -->
      <div class="role-selector">
        <button type="button" class="role-btn active" data-role="Client">Client Portal</button>
        <button type="button" class="role-btn" data-role="Admin">Admin Portal</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">User ID / Email</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="name@company.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="auth-options">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox"> Remember me
          </label>
          <a href="404.html">Forgot Password?</a>
        </div>

        <div id="auth-error" class="error-message"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="Signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
